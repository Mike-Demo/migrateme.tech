<!doctype html>
<html lang="en" class="wa-theme-default wa-palette-default wa-light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mm-theme');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.remove('wa-light', 'wa-dark');
          el.classList.add(dark ? 'wa-dark' : 'wa-light');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.12.0/dist/styles/webawesome.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.12.0/dist/styles/utilities/fouce.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5.2.6/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono@5.2.6/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MigrateMe Universal — browser-only content migration</title>
    <meta
      name="description"
      content="Convert content exports between CMS and static-site formats entirely in your browser. Files never leave your device."
    />
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://universal.migrateme.tech/">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://universal.migrateme.tech/#app",
            "name": "MigrateMe Universal",

            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Any (web browser)",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "license": "https://opensource.org/licenses/MIT",
            "description": "Anything-to-anything content migration that runs entirely in your browser. 37 platforms and formats, one canonical hub, and the Open Migration Package (OMP) open standard.",
            "isPartOf": { "@id": "https://migrateme.tech/#project" }
          },
          {
            "@type": "WebSite",
            "@id": "https://universal.migrateme.tech/#site",

            "url": "https://universal.migrateme.tech/",
            "isPartOf": { "@id": "https://migrateme.tech/#project" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
