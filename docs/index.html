<section id="sec-what"><h2 id="what-it-does"><i class="fa-solid fa-gears"></i>What it does</h2>
  <p>Migrating a site between platforms usually means hand-written scripts, silent data loss, and no way to rehearse. migrateme.tech treats a migration as a pipeline you can inspect: extract, map, rehearse with a full dry-run risk report, approve, execute with checkpoints, then validate with a reconciliation report.</p>
  <ul>
    <li><strong>First proven path:</strong> WordPress (WXR export) → Markdown / MDX, run end-to-end against a real site (see Proof)</li>
    <li><strong>One core engine, three surfaces:</strong> CLI, MCP server, and web</li>
    <li><strong>AI field mapping</strong> with strict output validation — deterministic rules first, AI only where fields get messy</li>
    <li><strong>Safe by default:</strong> dry-run before execution, checkpointed runs with resume, idempotent writes</li>
    <li><strong>New in Universal:</strong> the same canonical model, opened up to every format below — in your browser, with nothing uploaded</li>
  </ul>

  </section>
<section id="sec-universal"><h2 id="universal"><i class="fa-solid fa-right-left"></i>Universal: anything to anything</h2>
  <p><strong>MigrateMe Universal</strong> generalises the v1 pipeline into a canonical hub. Every source parses into one shared content model; every destination renders from it. No N×N pair converters — add one parser or one renderer and it composes with everything already there. It runs entirely in your browser: files you open never leave your device.</p>
  <ul>
    <li><strong>In:</strong> WordPress WXR (plus the Squarespace and WordPress.com variants), Markdown / MDX folders, Ghost, RSS / Atom, Blogger, Shopify CSV, Webflow CMS CSV, Notion ZIP, Medium ZIP, Sanity NDJSON, Contentful JSON, Open Migration Package — and a Scanner (lite) that reads a public site’s sitemap, feeds, and structured data when a platform offers no export. It is a best-effort reader, labelled as one — not a crawler, and it never bypasses logins or paywalls</li>
    <li><strong>Out:</strong> Markdown / MDX, WordPress WXR, Ghost, static HTML, RSS / Atom, Blogger, Shopify CSV, Webflow CSV, Sanity NDJSON, Contentful import JSON, canonical JSON, CSV, and the Open Migration Package</li>
    <li><strong>Honest by construction:</strong> every route is labelled Supported, Lossy (with the losses named in the report), or Planned. The registry drives <strong>1,332 pair pages</strong> — one for every directed source × destination pair — each stating what a conversion keeps and drops before you run it</li>
    <li><strong>Accessible:</strong> built to WCAG 2.2 AA — full keyboard flow, visible focus, statuses announced as icon plus text (never colour alone), and generated HTML that flags missing alt text</li>
  </ul>
  <p><a href="https://migrateme-universal-4zev.bolt.host"><strong>Try Universal live</strong></a> — pick a pair, or start from any pair page. Universal was built in a single Bolt Forge weekend and folded into this repository on October 18, 2026 (<a href="https://github.com/Mike-Demo/migrateme.tech/pull/35">PR #35</a>): the connectors live in <code>packages/connectors</code>, the app in <code>apps/web</code>.</p>

  </section>
<section id="sec-standard"><h2 id="standard"><i class="fa-solid fa-file-contract"></i>The standard: Open Migration Package</h2>
  <p>Universal is the reference implementation of the <strong>Open Migration Package (OMP)</strong> — an open format any tool can read or write, so content stops being hostage to whichever platform holds it today. A package is a folder (or ZIP) with a verifiable shape:</p>
  <ul>
    <li><code>manifest.json</code> — format and version, source platform, every item, asset, taxonomy term, field mapping, and provenance entry</li>
    <li><code>content/</code> — one Markdown / MDX file per item; bodies can also be expressed as Portable Text blocks</li>
    <li><code>assets/</code> — the binaries, indexed; <strong>SHA-256 checksums</strong> over the package, BagIt-style (RFC 8493), so an importer can prove nothing was altered or dropped silently</li>
  </ul>
  <p>The JSON Schema, validator, and full specification live in this repository (<code>packages/format</code>, <a href="https://github.com/Mike-Demo/migrateme.tech/blob/main/docs/format/open-migration-package.md">docs/format</a>), with three conformance levels — OMP Reader, Writer, and Full. <strong>The adoption ask:</strong> if you build a CMS, a site builder, or an AI app builder, ship OMP import and export. Your users’ content should be able to leave — and arrive — without a rescue mission. The platforms named on this page are the first adoption targets.</p>

  </section>
<section id="sec-proof"><h2 id="proof"><i class="fa-solid fa-clipboard-check"></i>Proof, not promises</h2>
  <p>On October 14, 2026 the toolkit ran against a real WordPress site — not a fixture. The source is <a href="https://wp.sandbox.migrateme.tech">DXS</a>, a purpose-built WordPress testbed; its live export went through the full pipeline: plan, dry run, approved migration, validation.</p>
  <ul>
    <li><strong>44 items</strong> migrated — posts (incl. draft, private, and scheduled), pages, attachments, plus the site's templates, navigation, global styles, and even its AI Guidelines</li>
    <li><strong>420 field mappings</strong> — 287 deterministic, 133 held for human review rather than guessed</li>
    <li><strong>310 risks</strong> flagged in the plan; <strong>zero</strong> files written by the dry run</li>
    <li><strong>Validation passed:</strong> 44 expected, 44 found, empty exception queue</li>
  </ul>

  <h2 id="paid-for"><i class="fa-solid fa-hand-holding-heart"></i>How it's paid for</h2>
  <p><strong>Freemium, with a donation bundle instead of a paywall.</strong> The toolkit is free and MIT-licensed, and the AI step runs a local open-weight model, so a migration costs nothing to run — that's what makes freemium honest here rather than a trial in disguise.</p>
  <p>When a migration succeeds, the tool inventories the open-source technology it touched: the platform the site came <em>from</em>, the platform it's going <em>to</em>, and the open-source stack the tool itself stands on. Where a project has an open-source foundation behind it (the WordPress Foundation is the model), the tool assembles a suggested donation across all three directions — source, destination, and the conversion itself. A Humble Bundle–style slider lets you set the amount and choose the split: how much supports this tool, and how much flows to the foundations and libraries that made the original site, the move, and the new site possible.</p>
  <p>Designed, not yet wired: the MVP ships the migration pipeline; the donation bundle is the business model it will grow into, because a tool that moves people between open-source platforms should feed the commons it depends on.</p>
  <div class="card" id="bundle-demo">
    <p style="margin-top:0"><strong>Try the split</strong> — a concept demo of the bundle, Humble-style. Set a total, pick a preset or drag the sliders; the total never changes, only who it's shared with. <em>No payments are taken.</em></p>
    <p>Total donation: $<input id="bd-total" type="number" min="0" step="1" value="25" style="width:5.5em;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:0.15em 0.4em"></p>
    <p>
      <label><input type="radio" name="bd-preset" value="default" checked> Default split</label> ·
      <label><input type="radio" name="bd-preset" value="commons"> Extra to the commons</label> ·
      <label><input type="radio" name="bd-preset" value="custom"> Custom amount</label>
    </p>
    <div id="bd-rows"></div>
  </div>
  <script>
    (function () {
      var recipients = [
        { id: 'source', label: 'Where it came from — the source platform\u2019s foundation', def: 35, commons: 45 },
        { id: 'dest',   label: 'Where it\u2019s going — the destination platform\u2019s foundation', def: 25, commons: 35 },
        { id: 'libs',   label: 'The open-source libraries the conversion stands on', def: 25, commons: 15 },
        { id: 'tool',   label: 'migrateme.tech — the tool itself', def: 15, commons: 5 }
      ];
      var rowsEl = document.getElementById('bd-rows');
      var totalEl = document.getElementById('bd-total');
      recipients.forEach(function (r) {
        var row = document.createElement('p');
        row.innerHTML = '<label style="display:block;font-size:0.92rem;color:#c9d1d9">' + r.label + '</label>' +
          '<input type="range" min="0" max="100" step="1" value="' + r.def + '" data-id="' + r.id + '" style="width:70%">' +
          ' <span data-amt="' + r.id + '"></span>';
        rowsEl.appendChild(row);
      });
      var sliders = Array.prototype.slice.call(rowsEl.querySelectorAll('input[type=range]'));
      function shares() { return sliders.map(function (s) { return Number(s.value); }); }
      function render() {
        var total = Math.max(0, Number(totalEl.value) || 0);
        var sh = shares(), sum = sh.reduce(function (a, b) { return a + b; }, 0) || 1;
        recipients.forEach(function (r, i) {
          var amt = total * sh[i] / sum;
          rowsEl.querySelector('[data-amt="' + r.id + '"]').textContent = '$' + amt.toFixed(2);
        });
      }
      function applyPreset(name) {
        recipients.forEach(function (r, i) { sliders[i].value = (name === 'commons') ? r.commons : r.def; });
        render();
      }
      sliders.forEach(function (s) {
        s.addEventListener('input', function () {
          document.querySelector('input[name=bd-preset][value=custom]').checked = true;
          var changed = sliders.indexOf(s), v = Number(s.value);
          var others = sliders.filter(function (_, i) { return i !== changed; });
          var rest = 100 - v, osum = others.reduce(function (a, o) { return a + Number(o.value); }, 0);
          others.forEach(function (o) { o.value = osum ? Math.round(rest * Number(o.value) / osum) : Math.round(rest / others.length); });
          var drift = 100 - shares().reduce(function (a, b) { return a + b; }, 0);
          if (drift && others.length) { others[0].value = Number(others[0].value) + drift; }
          render();
        });
      });
      document.querySelectorAll('input[name=bd-preset]').forEach(function (r) {
        r.addEventListener('change', function () { if (r.value !== 'custom') applyPreset(r.value); });
      });
      totalEl.addEventListener('input', render);
      render();
    })();
  </script>

    <h2 id="open-source"><i class="fa-solid fa-code-branch"></i>Open source, top to bottom</h2>
  <p>This project is open source standing on open source — and the donation bundle above is priced from exactly this inventory. The tool's job, when it ships, is to detect stacks like these at a migration's source and destination; these are the ones this migration story itself used, at every step:</p>
  <table>
    <tr><th>Layer</th><th>Open-source stack</th></tr>
    <tr><td>The source</td><td><strong>WordPress</strong> (GPL, WordPress Foundation) on PHP and MySQL — and <strong>Simply Static</strong> (GPL), the plugin that produced the SpaceFast edition's export</td></tr>
    <tr><td>The toolkit</td><td><strong>TypeScript</strong> on <strong>Node.js</strong>; <strong>Zod</strong> for schema validation, <strong>saxes</strong> for WXR/XML parsing, <strong>better-sqlite3 / SQLite</strong> for checkpoint state, the <strong>Model Context Protocol SDK</strong> for the agent surface, <strong>pnpm</strong> and <strong>Vitest</strong> in the toolchain</td></tr>
    <tr><td>The AI</td><td><strong>Ollama</strong> serving open-weight models locally — the mapping step runs on the user's machine, under the user's choice of model</td></tr>
    <tr><td>The formats</td><td><strong>Markdown / MDX</strong>, <strong>JSON Schema</strong>, <strong>Portable Text</strong>, <strong>BagIt</strong> (RFC 8493), the <strong>Model Context Protocol</strong> — and now the <strong>Open Migration Package</strong> itself, this project’s own contribution to the list. Every interchange format in the pipeline is an open one</td></tr>
    <tr><td>Universal</td><td><strong>React</strong> and <strong>Vite</strong>, styled on the open <strong>Web Awesome</strong> design system — built in a Bolt Forge weekend, then folded into this repo and re-verified locally before merge</td></tr>
    <tr><td>The testbeds</td><td><strong>React</strong>, <strong>Vite</strong>, <strong>Tailwind CSS</strong>, <strong>shadcn/ui</strong> on <strong>Radix UI</strong>, <strong>TanStack</strong> Router / Query / Start, <strong>React Hook Form</strong>, and <strong>Supabase</strong> on <strong>PostgreSQL</strong> for the cloud edition</td></tr>
    <tr><td>These sites</td><td>Hand-written HTML/CSS/JS (and the <strong>Font Awesome</strong> free icons in these headings) on GitHub Pages; the migration-output site is generated with <strong>Python</strong>, the <strong>Markdown</strong> library, and <strong>Pillow</strong></td></tr>
  </table>
  <p>One honest exception, named rather than hidden: the code was planned and largely written with GitHub Copilot, which is proprietary. Everything it produced, and everything that code runs on, is open.</p>

<h2 id="status"><i class="fa-solid fa-signal"></i>Status</h2>
  <p>Built in the open for the DEV Hacktoberfest Open-Source AI Challenge, Week 2 ("Side Hustle"), October 12–18, 2026 — planned and built with GitHub Copilot, with the full paper trail in the repository.</p>
  <p>Then, in one Bolt Forge weekend (October 17–18, 2026): MigrateMe Universal — anything-to-anything conversion with an honest Supported / Lossy / Planned registry — folded into this repository, and the platform-neutral format shipped as the <strong>Open Migration Package</strong> (<a href="https://github.com/Mike-Demo/migrateme.tech/issues/34">issue #34</a>), with Universal as its reference implementation.</p>
  <p>Next: the pair-subdomain rollout so every one of the 1,332 pair pages gets its own <code>source.destination</code> address, OMP adoption outreach to the platforms above, and a server-side scanner for sources with no export at all.</p>
